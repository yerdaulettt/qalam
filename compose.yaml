services:
  postgres:
    image: postgres:17.9-alpine3.23
    container_name: postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    command: "postgres -c wal_level=logical"
    volumes:
      - "./:/docker-entrypoint-initdb.d"
      - "dbdata:/var/lib/postgresql/data"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d book_service"]
      interval: 10s
      retries: 3
      timeout: 10s
      start_period: 10s

  migrate:
    image: migrate/migrate:v4.20.1
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - "./book-service/migrations:/book-migrations"
      - "./user-service/migrations:/user-migrations"
      - "./review-service/migrations:/review-migrations"
    env_file:
      - .env
    entrypoint: ["sh", "-c"]
    command: |
      "migrate -path=/book-migrations -database ${BOOK_DB} up
      migrate -path=/user-migrations -database ${USER_DB} up
      migrate -path=/review-migrations -database ${REVIEW_DB} up"

  debezium:
    image: quay.io/debezium/server:3.7.1.Final
    container_name: debezium
    ports:
      - "8084:8084"
    volumes:
      - "./debezium:/debezium/config"
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      rabbit:
        condition: service_healthy

  rabbit:
    image: rabbitmq:4.3.5-management-alpine
    container_name: rabbit
    ports:
      - "5673:5672"
      - "15673:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 10s

  apigateway:
    build:
      context: api-gateway
      dockerfile: Dockerfile
    ports:
      - "8080:8080"

  user:
    build:
      context: user-service
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy

  book:
    build:
      context: book-service
      dockerfile: Dockerfile
    ports:
      - "8082:8082"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      rabbit:
        condition: service_healthy

  review:
    build:
      context: review-service
      dockerfile: Dockerfile
    ports:
      - "8083:8083"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      rabbit:
        condition: service_healthy

volumes:
  dbdata: