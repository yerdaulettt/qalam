services:
  postgres:
    image: postgres:17.9-alpine3.23
    container_name: postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - "./:/docker-entrypoint-initdb.d"
      - "dbdata:/var/lib/postgresql/data"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d book_service"]
      interval: 10s
      retries: 3
      timeout: 10s
      start_period: 10s

  rabbit:
    image: rabbitmq:4.3.5-management-alpine
    container_name: rabbit
    ports:
      - "5673:5672"
      - "15673:15672"
    healthcheck:
      test: "rabbitmq-diagnostics -q ping"
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 10s

  apigateway:
    build:
      context: api-gateway
      dockerfile: Dockerfile
    ports:
      - "8080:8080"

  user:
    build:
      context: user-service
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      rabbit:
        condition: service_healthy

  book:
    build:
      context: book-service
      dockerfile: Dockerfile
    ports:
      - "8082:8082"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      rabbit:
        condition: service_healthy

  review:
    build:
      context: review-service
      dockerfile: Dockerfile
    ports:
      - "8083:8083"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      rabbit:
        condition: service_healthy

volumes:
  dbdata: