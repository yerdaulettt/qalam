debezium.source.connector.class=io.debezium.connector.postgresql.PostgresConnector
debezium.source.plugin.name=pgoutput
debezium.source.offset.storage.file.filename=/debezium/data/offsets.dat
debezium.source.offset.flush.interval.ms=0
debezium.source.database.hostname=postgres
debezium.source.database.port=5432
debezium.source.database.user=user123
debezium.source.database.password=123
debezium.source.database.dbname=book_service
debezium.source.topic.prefix=book
debezium.source.table.include.list=public.outbox

debezium.format.key.schemas.enable=false
debezium.format.value.schemas.enable=false
debezium.format.header.schemas.enable=false
quarkus.http.port=8084

debezium.transforms=outbox
debezium.transforms.outbox.type=io.debezium.transforms.outbox.EventRouter
debezium.transforms.outbox.route.by.field=event_type
debezium.transforms.outbox.route.topic.replacement=$1
debezium.transforms.outbox.table.field.event.key=id
debezium.transforms.outbox.table.field.event.payload=event

debezium.sink.type=rabbitmq
debezium.sink.rabbitmq.connection.host=rabbit
debezium.sink.rabbitmq.connection.port=5672
debezium.sink.rabbitmq.connection.username=guest
debezium.sink.rabbitmq.connection.password=guest
debezium.sink.rabbitmq.exchange=events
debezium.sink.rabbitmq.routingKey.source=topic