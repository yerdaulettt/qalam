services:
  auth:
    url: "http://localhost:8081"
    endpoints:
      - "POST /auth/login"
      - "POST /auth/register"
      - "POST /auth/refresh"
      - "GET /api/my/profile"
  book:
    url: "http://localhost:8082"
    endpoints:
      - "GET /api/books"
      - "GET /api/books/{id}"
      - "GET /api/genres"
      - "PUT /api/books/{id}/ratings"
  review:
    url: "http://localhost:8083"
    endpoints:
      - "GET /api/books/{id}/reviews"
      - "GET /api/users/{username}/reviews"
      - "POST /api/reviews/{id}/reports"
      - "GET /api/my/reviews"
      - "POST /api/books/{id}/reviews"
      - "PUT /api/reviews/{id}/likes"
      - "PATCH /api/reviews/{id}"
      - "DELETE /api/reviews/{id}"